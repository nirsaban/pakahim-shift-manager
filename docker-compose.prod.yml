services:
  postgres:
    image: postgres:16-alpine
    container_name: pakahim-db
    restart: unless-stopped
    environment:
      # POSTGRES_USER/POSTGRES_DB only take effect on first initdb against an
      # empty volume - on the existing volume they're inert documentation.
      # The actual live rename (ALTER USER/DATABASE) is a one-time manual SQL
      # step against the running instance, done in lockstep with this change.
      POSTGRES_USER: pakahim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: pakahim
    volumes:
      - pakahim-db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakahim"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pakahim-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pakahim-redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Built and pushed by .github/workflows/deploy.yml — the VPS only pulls,
    # it never builds. Image is public (no secrets baked in; those come from
    # .env.prod at runtime), so no registry login is needed to pull it.
    image: ghcr.io/${IMAGE_OWNER:-nirsaban}/pakahim-shift-manager:latest
    container_name: pakahim-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Also set in the image; repeated here so a `docker compose up` on a host
      # with its own TZ cannot quietly hand the app a different clock.
      TZ: Asia/Jerusalem
      # Use the container_name (globally unique) rather than the service-name
      # alias "postgres"/"redis" — the app is also attached to the shared
      # miltech-association-net for the nginx proxy, and other projects on
      # that network (e.g. amutot-postgres) register their own "postgres"
      # service-name alias there too. That created a real DNS collision:
      # "postgres" resolved to amutot's DB instead of this project's own.
      DATABASE_URL: postgresql://pakahim:${POSTGRES_PASSWORD}@pakahim-db:5432/pakahim
      REDIS_URL: redis://pakahim-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published host ports — reached from the shared yogev-nginx reverse
    # proxy (miltech.cloud) over miltech-association-net, same pattern as
    # control-room / kursim / Amutot.
    networks:
      - internal
      - miltech-association-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal:
  miltech-association-net:
    external: true
    name: miltech-association-net

volumes:
  # Pinned to the exact physical volume names that already exist on the VPS
  # (created back when the compose project name was "takahim", i.e. the
  # deploy directory was /opt/takahim) - an unnamed volume gets prefixed by
  # the Compose project name, which now defaults to "pakahim" post-rename.
  # Without this pin, Compose would look for pakahim_pakahim-db-data, find
  # nothing, and silently create a fresh EMPTY volume - which would look
  # exactly like every real user's data had vanished. Do not remove this pin
  # without first migrating the actual data to a volume under the new name.
  pakahim-db-data:
    name: takahim_takahim-db-data
  pakahim-redis-data:
    name: takahim_takahim-redis-data
