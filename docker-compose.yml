version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: takahim-db
    environment:
      POSTGRES_USER: takahim
      POSTGRES_PASSWORD: takahim_dev_password
      POSTGRES_DB: takahim
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takahim"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: takahim-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
