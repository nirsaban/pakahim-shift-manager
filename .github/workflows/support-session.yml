name: Read a worker's dashboard (temporary)

# TEMPORARY - delete once the timezone verification is signed off.
#
# Port 22 is closed to everything but this runner, so this is the only way to
# check what a worker's SCREEN says rather than what the database holds. It
# mints a session on the server, fetches that worker's dashboard over HTTPS,
# prints only the times rendered on the page, and destroys the session again.
#
# The session token is never printed: GitHub masks it (it is a credential), and
# working around that masking would be the wrong instinct. The fetch and the
# text extraction both happen inside the script that holds the token, so what
# leaves the job is a list of rendered lines and nothing else.

on:
  workflow_dispatch:
    inputs:
      worker_number:
        description: Worker number whose dashboard to read (blank if only destroying)
        required: false
      destroy_session_id:
        description: Session id to revoke and exit
        required: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Mint a session, read the dashboard, destroy the session
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          WORKER: ${{ inputs.worker_number }}
          KILL: ${{ inputs.destroy_session_id }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20"
          ssh $SSH_OPTS "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "WORKER='$WORKER' KILL='$KILL' bash -s" << 'ENDSSH'
            set -e
            docker exec -e WORKER="$WORKER" -e KILL="$KILL" pakahim-app npx tsx -e "
              const run = async () => {
                const { prisma } = await import('./lib/db/prisma');
                const { createSession, destroySession } = await import('./lib/auth/session');
                const { signSessionJwt } = await import('./lib/auth/jwt');
                const { redis } = await import('./lib/redis');

                // Revoke-only mode: an earlier version of this workflow minted a
                // session without destroying it. Nothing can use it - its token was
                // masked in the log and never disclosed - but a live credential
                // should not be left to time out on its own.
                if (process.env.KILL) {
                  await destroySession(process.env.KILL);
                  console.log('DESTROYED=' + process.env.KILL);
                  await prisma.\$disconnect();
                  await redis.quit();
                  process.exit(0);
                }

                const user = await prisma.user.findFirst({ where: { workerNumber: process.env.WORKER } });
                if (!user) { console.log('NO_SUCH_WORKER'); process.exit(0); }
                console.log('WORKER=' + (user.firstName || '') + ' ' + (user.lastName || '') + ' role=' + user.role);

                const sessionId = await createSession({ userId: user.id, role: user.role });
                const token = await signSessionJwt({ userId: user.id, sessionId, role: user.role });

                const res = await fetch('https://pakahim.miltech.cloud/dashboard', {
                  headers: { cookie: 'session=' + token },
                  redirect: 'manual',
                });
                const html = await res.text();
                await destroySession(sessionId);

                console.log('HTTP_STATUS=' + res.status);
                const stripped = html.replace(/<script[\s\S]*?<\/script>/g, ' ').replace(/<[^>]+>/g, '\n');
                const seen = new Set();
                const lines = [];
                for (const raw of stripped.split('\n')) {
                  const line = raw.trim();
                  if (!line || seen.has(line)) continue;
                  if (!/[0-9]{1,2}:[0-9]{2}/.test(line) && !/משמרת|פקחים|שלום|תחנ/.test(line)) continue;
                  seen.add(line);
                  lines.push(line);
                }
                for (const line of lines.slice(0, 40)) console.log('PAGE| ' + line);

                await prisma.\$disconnect();
                await redis.quit();
                process.exit(0);
              };
              run();
            "
          ENDSSH
