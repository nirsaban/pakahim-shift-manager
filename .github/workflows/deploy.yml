name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pakahim-shift-manager

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry layer pulls/pushes occasionally 503 — retry the whole step
      # a couple times before giving up, cheaper than failing the run.
      - name: Build and push (attempt 1)
        id: push_1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build and push (attempt 2)
        if: steps.push_1.outcome == 'failure'
        id: push_2
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build and push (attempt 3)
        if: steps.push_1.outcome == 'failure' && steps.push_2.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      # ConnectTimeout/ServerAlive* keep a dead-server run from hanging for
      # the default ~120s ssh timeout; BatchMode never prompts for a password.
      - name: SSH pre-flight (fail fast if server unreachable)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -euo pipefail
          echo "Probing TCP/22 on $DEPLOY_SSH_HOST..."
          if ! timeout 10 bash -c "</dev/tcp/$DEPLOY_SSH_HOST/22"; then
            echo "::error::TCP/22 unreachable on $DEPLOY_SSH_HOST"
            exit 1
          fi

      - name: Copy compose file to server
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"
          ssh $SSH_OPTS "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "mkdir -p /opt/pakahim"
          scp $SSH_OPTS docker-compose.prod.yml "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/opt/pakahim/docker-compose.prod.yml"

      - name: Deploy on server
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"
          ssh $SSH_OPTS "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" bash -s << 'ENDSSH'
            set -e
            cd /opt/pakahim
            if [ ! -f .env.prod ]; then
              echo "::error::/opt/pakahim/.env.prod is missing on the server — see DEPLOY.md one-time setup"
              exit 1
            fi
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          ENDSSH

      - name: Health check
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          sleep 20
          SSH_OPTS="-i $HOME/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"
          ssh $SSH_OPTS "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" bash -s << 'ENDSSH'
            set -e
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' pakahim-app)
            echo "Container health: $STATUS"
            if [ "$STATUS" != "healthy" ]; then
              docker compose -f /opt/pakahim/docker-compose.prod.yml --env-file /opt/pakahim/.env.prod logs --tail=50 app
              exit 1
            fi
            echo "Health check passed!"
          ENDSSH

      # The roster's hours are the product. This prints, on every deploy, what
      # the boot-time timezone repair did and what the database now holds - so a
      # shift reading three hours out is caught here rather than by a worker
      # turning up at the wrong time.
      - name: Verify roster times
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i $HOME/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4"
          ssh $SSH_OPTS "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" bash -s << 'ENDSSH'
            set -e
            echo "--- app clock"
            docker exec pakahim-app date
            echo "--- boot repair log"
            LOGS=$(docker compose -f /opt/pakahim/docker-compose.prod.yml --env-file /opt/pakahim/.env.prod \
              logs app 2>&1 | grep '\[timezone\]' | tail -20 || true)
            # Empty means the entrypoint step did not run at all - which would mean
            # the repair is not self-healing, so say so rather than printing nothing.
            if [ -z "$LOGS" ]; then
              echo "::warning::no [timezone] lines in the app log - the boot repair did not run"
            else
              echo "$LOGS"
            fi
            echo "--- rows still holding pre-fix times (must be 0)"
            docker exec pakahim-db psql -U pakahim -d pakahim -t -A -F' | ' -c \
              "SELECT count(*) FILTER (WHERE date::time='00:00:00') AS need_repair, count(*) AS total FROM shifts;"
            echo "--- do the displayed hours match the minutes parsed out of the Excel?"
            # duties.startMinutes/endMinutes are the raw numbers read from the
            # sheet. If the shift instant, rendered in Israel, disagrees with
            # them by even a minute, the hours on someone's phone are wrong.
            docker exec pakahim-db psql -U pakahim -d pakahim -t -A -F' | ' -c \
              "SELECT count(*) FILTER (
                        WHERE (extract(hour FROM s.\"startTime\" AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Jerusalem')*60
                             + extract(minute FROM s.\"startTime\" AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Jerusalem'))
                              <> d.\"startMinutes\") AS mismatched,
                      count(*) AS compared
               FROM shifts s JOIN duties d ON d.\"shiftId\" = s.id
               WHERE d.\"startMinutes\" IS NOT NULL;"
            echo "--- worker 797433, every shift on record"
            docker exec pakahim-db psql -U pakahim -d pakahim -t -A -F' | ' -c \
              "SELECT coalesce(u.\"firstName\",'?') AS name,
                      to_char(s.\"startTime\" AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Jerusalem','DD.MM HH24:MI') AS shows,
                      lpad((d.\"startMinutes\"/60)::text,2,'0')||':'||lpad((d.\"startMinutes\"%60)::text,2,'0') AS excel_says,
                      to_char(s.\"endTime\" AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Jerusalem','HH24:MI') AS ends,
                      lpad(((d.\"endMinutes\"%1440)/60)::text,2,'0')||':'||lpad((d.\"endMinutes\"%60)::text,2,'0') AS excel_end,
                      s.\"startTime\" AS stored_utc
               FROM users u JOIN shifts s ON s.\"workerId\" = u.id
               LEFT JOIN duties d ON d.\"shiftId\" = s.id
               WHERE u.\"workerNumber\" = '797433'
               ORDER BY s.\"startTime\" DESC LIMIT 10;"
            echo "--- next five shifts, as Israel reads them"
            docker exec pakahim-db psql -U pakahim -d pakahim -t -A -F' | ' -c \
              "SELECT to_char(\"startTime\" AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Jerusalem','DD.MM HH24:MI'),
                      to_char(\"endTime\" AT TIME ZONE 'UTC' AT TIME ZONE 'Asia/Jerusalem','HH24:MI'),
                      coalesce(region,'-')
               FROM shifts WHERE \"startTime\" > now() - interval '1 day'
               ORDER BY \"startTime\" LIMIT 5;"
          ENDSSH
