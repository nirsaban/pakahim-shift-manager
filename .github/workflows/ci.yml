name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma 7 requires an explicit generate step (no more postinstall auto-generation).
      # Without it every Prisma-derived type collapses to `any`, cascading into unrelated
      # "implicitly has an 'any' type" errors across any file using query results.
      # DATABASE_URL only needs to be resolvable for prisma.config.ts to load - generate
      # never connects - same placeholder pattern as the Dockerfile's builder stage.
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Unit tests only. lib/roster is pure, so these need no database and no
      # fixtures. The golden-corpus check (npm run verify:roster) is NOT run
      # here: it reads the real rosters, which are gitignored because they carry
      # inspector names, worker numbers and phone numbers. Run it locally, or in
      # a job with ROSTER_FIXTURE_DIR pointed at a private copy.
      - name: Unit tests
        run: npm test
