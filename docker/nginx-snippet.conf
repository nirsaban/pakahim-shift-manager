# Add this server block to the shared yogev-nginx config on the VPS
# (same file that already routes amutot.miltech.cloud / control-room),
# then reload nginx. Not applied automatically — that file lives outside
# this repo and is shared by other apps.

server {
    listen 80;
    server_name takahim.miltech.cloud;

    resolver 127.0.0.11 valid=10s;
    set $takahim_app takahim-app:3000;

    location / {
        proxy_pass http://$takahim_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Once DNS for takahim.miltech.cloud points at the VPS, get a cert and the
# proxy can be upgraded to HTTPS the same way miltech.cloud itself is
# (certbot + a 443 server block with ssl_certificate/ssl_certificate_key).
